name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  SONAR_PROJECT_KEY: CodeMaru-Dreamine_Dreamine.Hybrid.Wpf
  SONAR_ORGANIZATION: codemaru-dreamine
  SONAR_PROJECT_VERSION: 1.0.3
  SONAR_SCANNER_VERSION: 11.2.1
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

jobs:
  build-test-analyze:
    name: Build, test, package, and analyze
    runs-on: windows-2025
    steps:
      - name: Check out package
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: src/Hybrid.Wpf
          fetch-depth: 0

      - name: Check out Hybrid dependency
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: CodeMaru-Dreamine/Dreamine.Hybrid
          path: src/Hybrid

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 8.0.x

      - name: Restore central package versions
        shell: pwsh
        run: Copy-Item src/Hybrid.Wpf/Directory.Packages.props src/Directory.Packages.props -Force

      - name: Install analysis tools
        if: env.SONAR_TOKEN != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        shell: pwsh
        run: |
          dotnet tool install --global dotnet-sonarscanner --version $env:SONAR_SCANNER_VERSION
          dotnet tool install --global dotnet-coverage

      - name: Align SonarCloud project settings
        if: env.SONAR_TOKEN != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        shell: pwsh
        env:
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          $headers = @{ Accept = 'application/json'; Authorization = "Bearer $env:SONAR_TOKEN" }
          $basicToken = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("$($env:SONAR_TOKEN):"))
          $basicHeaders = @{ Accept = 'application/json'; Authorization = "Basic $basicToken" }
          try {
            Invoke-RestMethod -Method Post -Uri 'https://sonarcloud.io/api/autoscan/activation' -Headers $basicHeaders -ContentType 'application/x-www-form-urlencoded' -Body @{ projectKey = $env:SONAR_PROJECT_KEY; enable = 'false' } | Out-Null
            $qualityGates = Invoke-RestMethod -Method Get -Uri "https://sonarcloud.io/api/qualitygates/list?organization=$($env:SONAR_ORGANIZATION)" -Headers $headers
            $qualityGateId = $qualityGates.default
            if ($null -eq $qualityGateId) {
              $qualityGateId = ($qualityGates.qualitygates | Where-Object name -eq 'Sonar way' | Select-Object -First 1).id
            }
            Invoke-RestMethod -Method Post -Uri 'https://sonarcloud.io/api/qualitygates/select' -Headers $headers -ContentType 'application/x-www-form-urlencoded' -Body @{ organization = $env:SONAR_ORGANIZATION; projectKey = $env:SONAR_PROJECT_KEY; gateId = $qualityGateId } | Out-Null
            $encodedProject = [Uri]::EscapeDataString($env:SONAR_PROJECT_KEY)
            $branches = Invoke-RestMethod -Method Get -Uri "https://sonarcloud.io/api/project_branches/list?project=$encodedProject" -Headers $headers
            $currentMain = $branches.branches | Where-Object isMain | Select-Object -First 1
            if ($null -ne $currentMain -and $currentMain.name -ne $env:GITHUB_DEFAULT_BRANCH) {
              $conflict = $branches.branches | Where-Object { -not $_.isMain -and $_.name -eq $env:GITHUB_DEFAULT_BRANCH } | Select-Object -First 1
              if ($null -ne $conflict) {
                Invoke-RestMethod -Method Post -Uri 'https://sonarcloud.io/api/project_branches/delete' -Headers $headers -ContentType 'application/x-www-form-urlencoded' -Body @{ project = $env:SONAR_PROJECT_KEY; branch = $env:GITHUB_DEFAULT_BRANCH } | Out-Null
              }
              Invoke-RestMethod -Method Post -Uri 'https://sonarcloud.io/api/project_branches/rename' -Headers $headers -ContentType 'application/x-www-form-urlencoded' -Body @{ project = $env:SONAR_PROJECT_KEY; name = $env:GITHUB_DEFAULT_BRANCH } | Out-Null
            }
            Invoke-RestMethod -Method Post -Uri 'https://sonarcloud.io/api/new_code_periods/set' -Headers $headers -ContentType 'application/x-www-form-urlencoded' -Body @{ project = $env:SONAR_PROJECT_KEY; type = 'NUMBER_OF_DAYS'; value = '30' } | Out-Null
            Invoke-RestMethod -Method Post -Uri 'https://sonarcloud.io/api/settings/set' -Headers $headers -ContentType 'application/x-www-form-urlencoded' -Body @{ component = $env:SONAR_PROJECT_KEY; key = 'sonar.qualitygate.ignoreSmallChanges'; value = 'false' } | Out-Null
          }
          catch {
            Write-Warning "SonarCloud project setting alignment skipped: $($_.Exception.Message)"
          }

      - name: Restore
        shell: pwsh
        run: dotnet restore src/Hybrid.Wpf/tests/Dreamine.Hybrid.Wpf.Tests/Dreamine.Hybrid.Wpf.Tests.csproj

      - name: Begin Sonar analysis
        if: env.SONAR_TOKEN != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        shell: pwsh
        run: >
          dotnet sonarscanner begin
          /k:"$env:SONAR_PROJECT_KEY"
          /o:"$env:SONAR_ORGANIZATION"
          /v:"$env:SONAR_PROJECT_VERSION"
          /d:sonar.token="$env:SONAR_TOKEN"
          /d:sonar.projectBaseDir="${{ github.workspace }}\src\Hybrid.Wpf"
          /d:sonar.scm.provider=git
          /d:sonar.sourceEncoding=UTF-8
          /d:sonar.cs.vscoveragexml.reportsPaths="$env:RUNNER_TEMP\TestResults\coverage.xml"
          /d:sonar.cs.vstest.reportsPaths="$env:RUNNER_TEMP\TestResults\**\*.trx"
          /d:sonar.exclusions="**/bin/**,**/obj/**,**/TestResults/**,**/*.png,**/*.ico"
          /d:sonar.coverage.exclusions="**/tests/**,**/*.xaml.cs"
          /d:sonar.cpd.exclusions="**/tests/**"

      - name: Build and test
        shell: pwsh
        run: |
          $project = 'src/Hybrid.Wpf/tests/Dreamine.Hybrid.Wpf.Tests/Dreamine.Hybrid.Wpf.Tests.csproj'
          if ($env:SONAR_TOKEN -ne '' -and ('${{ github.event_name }}' -ne 'pull_request' -or '${{ github.event.pull_request.head.repo.full_name }}' -eq '${{ github.repository }}')) {
            $command = "dotnet test $project --no-restore --configuration Release -m:1 -p:GeneratePackageOnBuild=false --results-directory $env:RUNNER_TEMP\TestResults --logger `"trx;LogFileName=tests.trx`""
            dotnet-coverage collect $command -f xml -o "$env:RUNNER_TEMP\TestResults\coverage.xml"
          }
          else {
            dotnet test $project --no-restore --configuration Release -m:1 -p:GeneratePackageOnBuild=false --results-directory "$env:RUNNER_TEMP\TestResults" --logger "trx;LogFileName=tests.trx"
          }

      - name: Pack
        shell: pwsh
        run: dotnet pack src/Hybrid.Wpf/Dreamine.Hybrid.Wpf.csproj --no-restore --configuration Release -p:GeneratePackageOnBuild=false --output "$env:RUNNER_TEMP\packages"

      - name: End Sonar analysis
        if: success() && env.SONAR_TOKEN != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        shell: pwsh
        run: dotnet sonarscanner end /d:sonar.token="$env:SONAR_TOKEN"
